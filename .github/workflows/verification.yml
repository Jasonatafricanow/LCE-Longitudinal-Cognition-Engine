name: Public Verification

on:
  push:
    branches:
      - master
      - verification/**
  pull_request:
    branches:
      - master
      - "feat/canonical-semantic-projection-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        input_mode: [standalone, canonical]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verification.txt

      - name: Install package and pinned verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-verification.txt

      - name: Check out pinned MR-Mem contract for canonical mode
        if: matrix.input_mode == 'canonical'
        uses: actions/checkout@v4
        with:
          repository: Jasonatafricanow/MR-Mem
          ref: 0685a8a2498cc828c8d500be6f4673e53fa6dc24
          path: _mr_mem_contract

      - name: Install optional MR-Mem contract
        if: matrix.input_mode == 'canonical'
        run: python -m pip install -e ./_mr_mem_contract

      - name: Run canonical public verification gate
        run: python scripts/verify.py
