name: Semantic Compiler Method Comparison (Research Only)

on:
  push:
    branches:
      - research/semantic-compiler-method-ablation-20261008

permissions:
  contents: read

jobs:
  compare-compilers:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.33,<1" "llama-cpp-python==0.3.16"
      - name: Compare compiler methods using fixed evidence
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u research/experiments/semantic_compiler_methods_20261008/run.py
      - name: Save full proposals, audit and cutoff receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-compiler-method-raw-results
          path: semantic_compiler_method_results.json
          if-no-files-found: ignore
