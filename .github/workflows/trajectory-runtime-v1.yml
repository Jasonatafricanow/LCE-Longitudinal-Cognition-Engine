name: Trajectory Runtime V1 Verification

on:
  push:
    branches:
      - "feature/trajectory-runtime-v1-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verification.txt

      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-verification.txt

      - name: Run canonical verification
        run: python scripts/verify.py

      - name: Run focused trajectory runtime tests
        run: |
          python -m pytest \
            tests/test_bitemporal_runtime.py \
            tests/test_line_graph_runtime.py \
            tests/test_trajectory_runtime.py -q
