name: Path B A4-R Trajectory Bootstrap

on:
  push:
    branches:
      - "verification/path-b-trajectory-bootstrap-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verification.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-verification.txt

      - name: Run A4-R trajectory bootstrap report
        run: python -m research.experiments.path_b_trajectory_bootstrap_20260927.experiment

      - name: Run A4-R trajectory invariants
        run: python -m pytest tests/research/test_path_b_trajectory_bootstrap_20260927.py -q
