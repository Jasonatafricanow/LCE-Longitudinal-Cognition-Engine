name: MR-Mem Canonical Projection
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-verification.txt
      - run: python -m pip install 'git+https://github.com/Jasonatafricanow/MR-Mem.git@7fdffe6112ab03bba006b3e76b1001240db37a7e'
      - run: python scripts/verify.py
