name: LCE Callable Projection Falsifiability

on:
  push:
    branches:
      - "verification/lce-callable-projection-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verification.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-verification.txt

      - name: Run callable projection experiment
        run: python -m research.experiments.lce_callable_projection_20260927.experiment

      - name: Run callable projection invariants
        run: python -m pytest tests/research/test_lce_callable_projection_20260927.py -q
