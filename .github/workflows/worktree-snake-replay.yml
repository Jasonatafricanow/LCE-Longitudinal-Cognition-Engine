name: Worktree Snake Replay Experiment

on:
  push:
    branches:
      - "verification/worktree-snake-replay-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verification.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-verification.txt

      - name: Run Worktree/Snake benchmark
        run: python research/experiments/worktree_snake_replay_20260926/experiment.py

      - name: Run mechanism invariants
        run: python -m pytest tests/research/test_worktree_snake_replay_20260926.py -q
